<svg viewBox="0 0 680 372" width="100%" role="img" font-family="var(--font-sans)">
<style>
:root {
    --color-text-primary: #1f2328;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
</style>

<title>N5 三阶段两 pass 出帧机制</title>
<desc>Stage 0 文生图出底图，Pass 1 编辑锁身份与空间，Pass 2 编辑锁服装站位，只有最终帧进入生产目录</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-size="14" font-weight="500" fill="var(--color-text-primary)">Stage 0 · 文生图出底图（不挂任何板）</text>
<g>
<rect x="40" y="46" width="250" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="165" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">基座 / Qwen-Image-2512 T2I</text>
<text x="165" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">四段 prompt · 16:9 ≥1344</text>
</g>
<path d="M290 72L406 72" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<g>
<rect x="410" y="46" width="230" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="525" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">_base.png 底图</text>
<text x="525" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">落 work/ · 中间产物</text>
</g>

<path d="M525 100L525 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<text x="40" y="146" font-size="14" font-weight="500" fill="var(--color-text-primary)">Pass 1 · 2511 编辑（锁身份 + 空间）</text>
<g>
<rect x="40" y="158" width="600" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="60" y="177" dominant-baseline="central" font-size="12" fill="#633806">image_1</text>
<text x="130" y="177" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">底图（被编辑目标）</text>
<text x="60" y="197" dominant-baseline="central" font-size="12" fill="#633806">image_2</text>
<text x="130" y="197" dominant-baseline="central" font-size="12" fill="#412402">SHEET 身份板</text>
<text x="350" y="177" dominant-baseline="central" font-size="12" fill="#633806">image_3</text>
<text x="420" y="177" dominant-baseline="central" font-size="12" fill="#412402">PLATE 场景板</text>
<text x="350" y="197" dominant-baseline="central" font-size="12" fill="#854F0B">→ _p1.png 落 work/</text>
</g>

<path d="M340 216L340 244" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<text x="40" y="262" font-size="14" font-weight="500" fill="var(--color-text-primary)">Pass 2 · 2511 再编辑（锁服装站位）</text>
<g>
<rect x="40" y="274" width="600" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="60" y="293" dominant-baseline="central" font-size="12" fill="#633806">image_1</text>
<text x="130" y="293" dominant-baseline="central" font-size="12" font-weight="500" fill="#412402">_p1.png（被编辑目标）</text>
<text x="60" y="313" dominant-baseline="central" font-size="12" fill="#633806">image_2</text>
<text x="130" y="313" dominant-baseline="central" font-size="12" fill="#412402">PAIR 服装站位板</text>
<text x="350" y="293" dominant-baseline="central" font-size="12" fill="#633806">image_3</text>
<text x="420" y="293" dominant-baseline="central" font-size="12" fill="#412402">留空，不重排</text>
<text x="350" y="313" dominant-baseline="central" font-size="12" fill="#854F0B">→ 最终帧回填 frame_key</text>
</g>

<g>
<rect x="40" y="344" width="600" height="20" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">只有 Pass 2 最终帧进 input/frames/ 并挂 H3 refs[1]；底图与 _p1 永不挂 H3</text>
</g>
</svg>