<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="470" fill="#f8fafc"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#0f172a">N14 之后 · 两版产物分叉（2026-11-21 定线）</text>
  <text x="30" y="62" font-size="13" fill="#64748b">成片版与片段版并列，不是对同一条成片拼两次；片段版专供 N17</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="30" y="185" width="150" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">N12 逐镜 mp4</text>
  <text x="105" y="230" font-size="11" text-anchor="middle" fill="#64748b">render_submit 产物</text>

  <rect x="215" y="185" width="150" height="62" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="290" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">N14 音轨精修</text>
  <text x="290" y="230" font-size="11" text-anchor="middle" fill="#64748b">audio_tighten.py</text>

  <line x1="180" y1="216" x2="213" y2="216" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <circle cx="410" cy="216" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="212" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">分叉</text>
  <text x="410" y="228" font-size="10" text-anchor="middle" fill="#92400e">两版并列</text>
  <line x1="365" y1="216" x2="378" y2="216" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 上：成片版 -->
  <path d="M440,205 C470,150 490,120 510,120" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arb)"/>
  <rect x="510" y="88" width="180" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="600" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d4ed8">成片版 · N15 → N16</text>
  <text x="600" y="132" font-size="11" text-anchor="middle" fill="#1e40af">concat_xfade + qc_gate</text>
  <rect x="730" y="88" width="215" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="837" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">单一全片 mp4 + QC 报告</text>
  <text x="837" y="132" font-size="11" text-anchor="middle" fill="#64748b">归档 / 快速复现 / 对照基线</text>
  <line x1="690" y1="119" x2="728" y2="119" stroke="#2563eb" stroke-width="2" marker-end="url(#arb)"/>
  <text x="470" y="100" font-size="12" font-weight="bold" fill="#2563eb">① 按 CSV 全段叠化直出</text>

  <!-- 下：片段版 -->
  <path d="M440,228 C470,300 490,330 510,330" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="510" y="298" width="180" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="600" y="322" font-size="14" font-weight="bold" text-anchor="middle" fill="#b91c1c">片段版 · 逐镜片段</text>
  <text x="600" y="342" font-size="11" text-anchor="middle" fill="#991b1b">prepare_two_versions.py</text>
  <text x="600" y="357" font-size="10" text-anchor="middle" fill="#991b1b">MOTION-ID + 剪辑单草稿</text>
  <rect x="730" y="298" width="215" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="837" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">N17 check / render / verify</text>
  <text x="837" y="342" font-size="11" text-anchor="middle" fill="#64748b">取舍 · 入出点 · 背景音 · 字幕</text>
  <text x="837" y="357" font-size="11" text-anchor="middle" fill="#64748b">→ 成片 + 剪辑单 + 验收报告</text>
  <line x1="690" y1="331" x2="728" y2="331" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="392" font-size="12" font-weight="bold" fill="#dc2626">② 保留逐镜素材，专供 N17 重新合成</text>

  <rect x="30" y="420" width="920" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="45" y="442" font-size="12" fill="#334155">关键：N17 从「片段」而非「成片」出发，取舍与入出点才可执行；concat_xfade.py 只服务成片版。</text>
</svg>
