<svg viewBox="0 0 680 300" width="100%" role="img" font-family="var(--font-sans)">
<style>
:root {
    --color-text-tertiary: #6e7781;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
}
</style>

<title>两级脚本流水线</title>
<desc>一份 shotlist.csv 同时供出帧脚本与装配脚本消费，共享 frames_common 逻辑</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="130" y="59" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">shotlist.csv</text>
<text x="130" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">19 字段 · 唯一真表</text>
</g>
<g>
<rect x="40" y="128" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="147" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">n5_inputs.json</text>
<text x="130" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">四段材料 · 不在 CSV</text>
</g>
<text x="130" y="204" text-anchor="middle" font-size="12" fill="var(--color-text-tertiary)">冻结关键帧 / C 块 / 画风句</text>

<path d="M220 68L300 68" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M220 156L300 120" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="304" y="44" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="404" y="63" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">frames_from_shotlist</text>
<text x="404" y="81" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517">_comfy.py 出帧 · 回填 frame_key</text>
</g>
<g>
<rect x="304" y="128" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="404" y="147" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">csv_to_timeline.py</text>
<text x="404" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">装配 timeline_data</text>
</g>

<path d="M504 72L556 72" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<path d="M504 156L556 156" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<g>
<rect x="560" y="44" width="80" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="600" y="63" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">frames/</text>
<text x="600" y="81" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">每镜 PNG</text>
</g>
<g>
<rect x="560" y="128" width="80" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="600" y="147" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">JSON</text>
<text x="600" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">双份副本</text>
</g>

<g>
<rect x="304" y="228" width="376" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="492" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">frames_common.py：四段重组 / 路径契约 / frame_key 回填 / 归档（两脚本共用）</text>
</g>
<path d="M404 184L404 226" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
